services:
  retail-app:
    build:
      context: .
    image: retail-app:${VERSION:-1.0.1}
    ports:
      - "8082:8081"
    environment:
      APP_ENV: ${APP_ENV:-UAT}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped